services:
  - type: web
    name: orbit
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: HOST
        value: 0.0.0.0
      - key: VITE_AUTH_ENABLED
        value: "false"
      - key: XAI_API_KEY
        sync: false
